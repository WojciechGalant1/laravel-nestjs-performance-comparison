; Loaded after the image's www.conf and docker.conf, so these values win.
[www]
listen = 9000

; One worker per vCPU; mirrors PM2 cluster instances = 4 on the NestJS side.
pm = static
pm.max_children = 4
pm.max_requests = 0

; Keep container environment (DB_*, JWT_*, APP_*) visible to PHP.
clear_env = no

access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
