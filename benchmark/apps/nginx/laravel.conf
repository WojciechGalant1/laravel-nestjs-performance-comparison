upstream laravel_fpm {
    server laravel-app:9000;
}

server {
    listen 80 default_server;
    server_name _;

    access_log off;
    client_max_body_size 1m;

    # API-only: every request goes to the front controller, so nginx needs no application files.
    # No fastcgi_keep_conn: with pm=static (4 children) an idle kept connection pins a worker.
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_pass laravel_fpm;
        fastcgi_read_timeout 60s;
    }
}
